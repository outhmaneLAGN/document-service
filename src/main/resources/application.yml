server:
  port: 8084

spring:
  application:
    name: document-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eqdom_credit}
    username: ${DB_USERNAME:eqdom}
    password: ${DB_PASSWORD:eqdom}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: document
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:change-me-in-env-this-is-a-dev-only-default-secret}
